[project]
name = "ra-mcp-kansallisarkisto-lib"
version = "0.3.0"
description = "Kansallisarkisto Sisältöhaku corpora — LanceDB ingest and full-text search"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    # API only, never the SDK: the SDK is initialised in the server package alone.
    # With no SDK configured these resolve to no-ops, so telemetry off costs nothing.
    "opentelemetry-api>=1.28.0",
    "lancedb>=0.20,<1",
    "pyarrow>=18,<25",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_mcp_kansallisarkisto_lib"]
