[project]
name = "ra-mcp-kansallisarkisto-lib"
version = "0.1.0"
description = "Kansallisarkisto Sisältöhaku corpora — LanceDB ingest and full-text search"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "lancedb>=0.20,<1",
    "pyarrow>=18,<25",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_mcp_kansallisarkisto_lib"]
