name: CodeQL

# Static analysis, which is what Scorecard's SAST check looks for and what this
# repository had none of. Free for public repositories. Two languages, because
# the Dagger module is Go and everything else is Python — analysing only one
# would leave the CI pipeline itself unexamined.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "40 3 * * 1" # Mondays, so a new rule pack is noticed without a push
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # write the findings to the Security tab
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
