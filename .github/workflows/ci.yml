name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Code Quality Checks
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: checks
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Run Tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      # The only place the index configuration is verified end to end: Swedish
      # stemming and accent folding are index-time settings, so a wrong FTS
      # config is invisible to anything that searches only exact forms. Builds
      # the production image, ingests the test fixture into a mounted LanceDB
      # table and drives it with a real MCP client.
      - name: Run end-to-end MCP smoke test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test-mcp
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      # Verifies the documented no-data path: the image ships empty, and the
      # server must still boot and answer /health rather than crash-loop. The
      # end-to-end test above always mounts a table, so nothing else covers it.
      - name: Verify the image boots without data
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test-server
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"
