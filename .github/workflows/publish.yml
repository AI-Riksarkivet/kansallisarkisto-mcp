name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish image with SBOM & Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      image: docker.io/riksarkivet/kansallisarkisto-mcp
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version and image tags
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version' packages/kansallisarkisto-mcp/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Only a tagged release may move :latest. A workflow_dispatch run skips
          # the tag/version validation below, so letting it publish :latest would
          # let an unvalidated build replace the image everyone pulls by default.
          {
            echo "tags<<TAGS_EOF"
            echo "riksarkivet/kansallisarkisto-mcp:${TAG}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "riksarkivet/kansallisarkisto-mcp:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Both packages, not just the one the image is named after: they are
      # released together and the lib version could drift unnoticed.
      - name: Validate tag matches both package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          status=0
          for manifest in packages/kansallisarkisto-mcp/pyproject.toml packages/kansallisarkisto-lib/pyproject.toml; do
            VERSION=$(grep '^version' "$manifest" | sed 's/version = "\(.*\)"/\1/')
            if [[ "$TAG" != "v${VERSION}" ]]; then
              echo "::error::tag ${TAG} does not match ${manifest} version v${VERSION}"
              status=1
            fi
          done
          exit $status

      - name: Run Tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      # Gate the release on the image scan, before anything is pushed. Trivy is
      # run with --ignore-unfixed (see .dagger/scan.go), so this fails only on
      # findings a rebuild or a dependency bump can actually clear.
      - name: Scan image for vulnerabilities
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: scan-ci
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push with attestations
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/kansallisarkisto-mcp.dockerfile
          push: true
          tags: ${{ steps.version.outputs.tags }}
          platforms: linux/amd64
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract provenance from image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: "extract-provenance-attestation --image-ref riksarkivet/kansallisarkisto-mcp:${{ steps.version.outputs.tag }} export --path ./provenance.intoto.jsonl"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      # BuildKit already attaches an SBOM to the manifest; these are the same
      # bill of materials in the two formats consumers actually ask for, next to
      # the provenance on the release page.
      - name: Generate SBOMs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: "generate-sbom-spdx export --path ./sbom.spdx.json"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Generate CycloneDX SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: "generate-sbom-cyclone-dx export --path ./sbom.cyclonedx.json"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Upload attestations and SBOMs as release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ./provenance.intoto.jsonl
            ./sbom.spdx.json
            ./sbom.cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Signing riksarkivet/kansallisarkisto-mcp@${DIGEST}"
          cosign sign --yes riksarkivet/kansallisarkisto-mcp@${DIGEST}

      # Pull back what was just pushed and check it actually serves. Everything
      # above this point tests a locally built image; this is the only step that
      # exercises the artefact consumers will receive.
      - name: Verify the published image
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: "test-published --image-ref riksarkivet/kansallisarkisto-mcp:${{ steps.version.outputs.tag }}"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

  # SLSA Build L3 provenance: generated in the SLSA project's isolated trusted
  # builder (own OIDC identity — the publish job above cannot forge it), signed
  # keylessly via Sigstore, and attached to the image in the registry. Verify:
  #   slsa-verifier verify-image docker.io/riksarkivet/kansallisarkisto-mcp@<digest> \
  #     --source-uri github.com/AI-Riksarkivet/kansallisarkisto-mcp
  # The generator must be referenced by release tag (not SHA): slsa-verifier
  # validates the builder identity against the tagged workflow ref.
  provenance:
    name: Generate SLSA L3 provenance
    needs: [publish]
    # Deliberately NOT gated on a tag ref: the publish job pushes an image on
    # workflow_dispatch too, and an image that ships without provenance is
    # exactly the gap this job exists to close. The release-asset steps above
    # stay tag-gated because they attach to a GitHub release, which a dispatch
    # run does not have.
    permissions:
      actions: read # read the workflow run when generating provenance
      id-token: write # keyless signing of the attestation
      packages: write # attach the attestation to the registry image
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_SECRET }}
