name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish image with SBOM & Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      image: docker.io/riksarkivet/kansallisarkisto-mcp
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version' packages/kansallisarkisto-mcp/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=$(grep '^version' packages/kansallisarkisto-mcp/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" != "v${VERSION}" ]]; then
              echo "::error::tag ${TAG} does not match packages/kansallisarkisto-mcp/pyproject.toml version v${VERSION}"
              exit 1
            fi
          fi

      - name: Run Tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push with attestations
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/kansallisarkisto-mcp.dockerfile
          push: true
          tags: |
            riksarkivet/kansallisarkisto-mcp:${{ steps.version.outputs.tag }}
            riksarkivet/kansallisarkisto-mcp:latest
          platforms: linux/amd64
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract provenance from image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: "extract-provenance-attestation --image-ref riksarkivet/kansallisarkisto-mcp:${{ steps.version.outputs.tag }} export --path ./provenance.intoto.jsonl"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Upload attestations as release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          files: |
            ./provenance.intoto.jsonl

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Signing riksarkivet/kansallisarkisto-mcp@${DIGEST}"
          cosign sign --yes riksarkivet/kansallisarkisto-mcp@${DIGEST}

  # SLSA Build L3 provenance: generated in the SLSA project's isolated trusted
  # builder (own OIDC identity — the publish job above cannot forge it), signed
  # keylessly via Sigstore, and attached to the image in the registry. Verify:
  #   slsa-verifier verify-image docker.io/riksarkivet/kansallisarkisto-mcp@<digest> \
  #     --source-uri github.com/carpelan/kansallisarkisto-mcp
  # The generator must be referenced by release tag (not SHA): slsa-verifier
  # validates the builder identity against the tagged workflow ref.
  provenance:
    name: Generate SLSA L3 provenance
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read # read the workflow run when generating provenance
      id-token: write # keyless signing of the attestation
      packages: write # attach the attestation to the registry image
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
      # Private repo: acknowledge that the signed provenance (and with it the
      # repo name) lands in the public Rekor log — already the case via the
      # cosign sign step's Rekor entry.
      private-repository: true
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_SECRET }}
