name: Scorecard supply-chain security

# OpenSSF Scorecard grades this repository's supply-chain posture out of 10 —
# pinned dependencies, signed releases, branch protection, token permissions and
# so on. `publish_results: true` is what makes the score public, and is what the
# README badge reads; it is silently forced to false on a private repository, so
# this only started being useful when the repo went public.
on:
  # The Branch-Protection check only ever looks at the default branch.
  branch_protection_rule:
  # Keeps the Maintained check fresh even in a quiet week.
  schedule:
    - cron: "30 1 * * 6" # Saturdays, 01:30 UTC
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to the Security tab
      id-token: write # publish the result, which is what the badge reads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Branch-Protection is the one check that needs a PAT with repo scope
          # even on a public repository, so it scores 0 until one is configured.
          # Nothing else here depends on it:
          #   repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload the SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
