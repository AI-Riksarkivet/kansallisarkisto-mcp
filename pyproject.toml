[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ra-mcp-kansallisarkisto-lib = { workspace = true }
ra-mcp-kansallisarkisto-mcp = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.25.0",
    "ruff",
]

[tool.ruff]
line-length = 200

[tool.ruff.lint.isort]
# Workspace packages: without this, ruff >= 0.16 groups them as third-party.
known-first-party = ["ra_mcp_kansallisarkisto_lib", "ra_mcp_kansallisarkisto_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
